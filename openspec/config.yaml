schema: spec-driven

context: |
  Glowy — русскоязычный AI-планировщик задач. Главная ценность: спокойное планирование
  с учётом задач и энергии пользователя.

  Стек: React 19 + TypeScript + Vite, React Router, Tailwind, Zustand; Express 5 strict
  ESM TypeScript, Prisma и PostgreSQL; Zod на границах; Vitest, Playwright и backend HTTP tests.
  Frontend API clients находятся в src/api, client state — в src/store, routes — в src/pages.
  Backend routes должны быть тонкими; AI-логика находится в backend/services/ai. Единственный
  Prisma client — backend/lib/prisma.ts; NodeNext imports используют emitted .js suffix.

  AI только предлагает ответы и черновики и никогда не изменяет данные без явного подтверждения.
  Auth, подписки, AI-лимиты, платежи и доступ проверяются на backend. Секреты и пользовательские
  тексты нельзя читать, коммитить или логировать. Production PostgreSQL содержит живые данные:
  migration требует явного согласия пользователя и подтверждённого backup Timeweb. Запрещены
  production deploy/restart, prisma migrate reset/db push и изменение внешних кабинетов без
  явного согласия.

  Пользовательский текст остаётся русским до отдельного i18n change. LandingPage.tsx нельзя
  менять без явного запроса. Контракт даты задачи: YYYY-MM-DD или пустая строка.

  До работы прочитать AGENTS.md, .specify/memory/constitution.md, актуальный handoff и roadmap.
  Канонические требования находятся в openspec/specs. Корневые specs/001-*…024-* и .specify —
  исторический read-only слой. Roadmap описывает планы и не доказывает текущее поведение.

  Все OpenSpec-артефакты писать по-русски. Структурные headings OpenSpec и ключевые слова
  SHALL/MUST сохранять на английском для валидатора.

rules:
  proposal:
    - Указывать Non-goals и отдельно отмечать влияние на runtime, данные, production и rollback.
    - Называть каждую новую или изменяемую capability точным kebab-case путём; tooling-only change помечать skip_specs.
    - Не включать обещания сроков и не выдавать roadmap за утверждённое текущее поведение.
  specs:
    - Каждый Requirement должен использовать SHALL или MUST и иметь минимум один Scenario.
    - Сценарии должны использовать headings #### Scenario и явные WHEN/THEN пункты.
    - Описывать наблюдаемое поведение и контракт, а не компоненты или пошаговую реализацию.
    - Для baseline подтверждать current behavior кодом, тестами или актуальным handoff; сомнительное не включать.
  design:
    - Фиксировать рассмотренные альтернативы, границы безопасности, migration и rollback для рискованных изменений.
    - Переиспользовать существующие auth, AI, payment, API и database flows либо обосновать отклонение.
  tasks:
    - Каждая задача должна содержать собственный способ проверки и быть достаточно малой для одного рабочего блока.
    - Выносить production, database migration, payment activation и внешнюю конфигурацию в явные approval-задачи.

operations:
  apply:
    guidance:
      - Сохранять пользовательские изменения и не смешивать несвязанный рефакторинг или dependency churn.
      - После каждого завершённого блока отмечать только фактически выполненные задачи и запускать соразмерные проверки.
      - Не выполнять push, deploy, production migration или внешнюю конфигурацию без явного согласия пользователя.
  archive:
    guidance:
      - До archive выполнить openspec-verify-change и strict validation; критические расхождения должны быть устранены.
      - Убедиться, что main specs описывают итоговое поведение и не содержат незавершённых обещаний roadmap.
